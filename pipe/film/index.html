<!doctype html>
<html
  lang="fr"
  data-composition-variables='[
    {"id":"brand","type":"string","label":"Marque","default":"BIG CE présente"},
    {"id":"headline","type":"string","label":"Titre","default":"PIPE MANA"},
    {"id":"line1","type":"string","label":"Ligne 1","default":"Fais pivoter les tuyaux"},
    {"id":"line2","type":"string","label":"Ligne 2","default":"Amène l’eau du château d’eau"},
    {"id":"line3","type":"string","label":"Ligne 3","default":"jusqu’aux 4 enseignes partenaires"},
    {"id":"prize","type":"string","label":"Lot","default":"10 000 F de chèques cadeaux à gagner"},
    {"id":"cta","type":"string","label":"Appel à l’action","default":"Joue sur guide2026.big-ce.com"},
    {"id":"accent","type":"color","label":"Couleur d’accent","default":"#5fe8ff"},
    {"id":"gold","type":"color","label":"Or","default":"#f2c35b"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Lilita One'; src: url('assets/fonts/LilitaOne.woff2') format('woff2'); font-weight: 400; font-style: normal; }
      :root { --ground: #07202f; --ink: #eef9ff; --font-display: 'Lilita One', 'Archivo Black', sans-serif; --font-body: 'Nunito', sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; background: var(--ground); font-family: var(--font-body); color: var(--ink); }
      #root > [data-composition-src] { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <!-- Pipe Mana · film d'intro (16 s, 1920×1080, 30 fps). Quatre scènes qui se passent le relais par un fondu-flou sur 0,15 s. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="16" data-width="1920" data-height="1080">
      <div id="ouverture" data-composition-id="ouverture" data-composition-src="compositions/ouverture.html" data-start="0" data-duration="3" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 1"></div>
      <div id="jeu" data-composition-id="jeu" data-composition-src="compositions/jeu.html" data-start="2.85" data-duration="6" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 2"></div>
      <div id="enseignes" data-composition-id="enseignes" data-composition-src="compositions/enseignes.html" data-start="8.7" data-duration="4" data-track-index="3" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 3"></div>
      <div id="fin" data-composition-id="fin" data-composition-src="compositions/fin.html" data-start="12.55" data-duration="3.45" data-track-index="4" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 4"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
